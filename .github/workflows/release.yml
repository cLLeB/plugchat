# Publishes a release when a version tag is pushed:
#
#   npm version patch        (or minor / major; updates package.json and creates the tag)
#   git push --follow-tags
#
# It then: runs the tests, builds the container image and pushes it to GitHub's
# registry as ghcr.io/<owner>/plugchat, creates a GitHub release, and publishes
# the package to npm.
#
# npm publishing uses "trusted publishing": no token is stored anywhere. On
# npmjs.com, the package's settings name this repository and this workflow file
# (release.yml) as a trusted publisher, and npm accepts what this job publishes.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write # lets npm verify that this workflow is the one publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run check:types

      - name: Container image
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/plugchat"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:latest"

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --notes "See CHANGELOG.md."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Last, so that a problem with npm never holds back the image or the release.
      - name: Publish to npm
        # The tests and type check already ran above, so the package's own pre-publish checks are skipped here.
        run: |
          npm install -g npm@latest
          npm publish --access public --ignore-scripts
