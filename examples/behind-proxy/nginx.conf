# A platform in any language with PlugChat running beside it, behind nginx.
#
#   your site (PHP, Django, Rails, .NET, Java ...)   127.0.0.1:8081
#   PlugChat (plugchat start)                        127.0.0.1:4401
#   what visitors reach                              127.0.0.1:8088
#
# The `location /plugchat/` block is the part to copy into your own nginx config.
worker_processes 1;
# Only so this example can run from a throwaway folder without root; your own nginx already sets these.
pid logs/nginx.pid;
error_log logs/error.log;
events { worker_connections 256; }

http {
  access_log off;
  client_body_temp_path temp/client_body;
  proxy_temp_path temp/proxy;
  fastcgi_temp_path temp/fastcgi;
  uwsgi_temp_path temp/uwsgi;
  scgi_temp_path temp/scgi;

  # Chat events travel over a WebSocket: pass the upgrade through, and only when one is asked for.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 127.0.0.1:8088;

    # the platform's own site
    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_set_header Host $host;
    }

    # PlugChat
    location /plugchat/ {
      proxy_pass http://127.0.0.1:4401;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 1h;       # keep quiet connections open
      client_max_body_size 25m;    # at least PlugChat's upload limit
    }
  }
}
