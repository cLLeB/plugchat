<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alumni Association — strict security policy</title>
  <link rel="stylesheet" href="/strict.css">
</head>

  <plug-chat server="/plugchat" token-url="/api/chat-token" heading="Member messages"></plug-chat>
