<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alumni Association — floating chat button</title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f2f3f5; color: #1c1e21; }
    main { max-width: 760px; margin: 20px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
    plug-chat-launcher { --pc-accent: #0b6b4f; }
    @media (prefers-color-scheme: dark) { body { background: #101214; color: #e8eaee; } .card { background: #1a1d21; } }
  </style>
</head>
<body>
  <main>
    <p><a href="/">← Back</a></p>
    <div class="card">
      <h2>Events</h2>
      <p>This page is about something else entirely. Chat lives in the button at the bottom-right corner and follows the member around the site.</p>
    </div>
    <div class="card"><h2>News</h2><p>The annual general meeting is on Friday.</p></div>
  </main>

  <!-- Everything the host adds: -->
  <script type="module" src="/plugchat/client/launcher.js"></script>
  <plug-chat-launcher server="/plugchat" token-url="/api/chat-token" heading="Member messages"></plug-chat-launcher>
</body>
</html>
